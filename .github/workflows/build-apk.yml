name: build-apk

on:
  push:
    paths:
      - 'android/**'
      - 'colorpick/web/**'
      - 'tools/sync_assets.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync web assets into APK
        run: python3 tools/sync_assets.py

      # ────────────────────────────────────────────────────────────────
      # 下载 Gradle 发行包这条路反复吃 504（services.gradle.org 与
      # downloads.gradle.org 都不通，但 Gradle 官方状态页显示正常），
      # 判断是 runner 出网被中间层拦了。
      #
      # 所以先试 runner 自带的 Gradle（免下载），只有它编译不过才回落
      # 到自己下载 8.9。两条路一次跑完，避免来回试。
      # ────────────────────────────────────────────────────────────────

      - name: Try build with preinstalled Gradle
        id: system_gradle
        continue-on-error: true
        run: |
          gradle --version
          gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Clean after failed attempt
        if: steps.system_gradle.outcome == 'failure'
        run: rm -rf android/.gradle android/app/build android/build

      - name: Cache Gradle 8.9
        if: steps.system_gradle.outcome == 'failure'
        uses: actions/cache@v4
        with:
          path: '~/gradle-8.9'
          key: gradle-8.9-bin-v2

      - name: Install Gradle 8.9
        if: steps.system_gradle.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -x "$HOME/gradle-8.9/bin/gradle" ]; then
            echo "Gradle 8.9 already cached, skip download"
            echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
            exit 0
          fi

          ok=0
          for url in \
            "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            "https://downloads.gradle-dn.com/distributions/gradle-8.9-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip"
          do
            echo "trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                  --connect-timeout 20 --max-time 600 \
                  -o /tmp/gradle-bin.zip "$url"; then
              if unzip -q -o /tmp/gradle-bin.zip -d "$HOME" 2>/dev/null \
                  && [ -x "$HOME/gradle-8.9/bin/gradle" ]; then
                ok=1
                break
              fi
              echo "downloaded file is not a valid Gradle distribution"
              rm -rf "$HOME/gradle-8.9"
            fi
            echo "that source failed, trying next"
          done

          if [ "$ok" != "1" ]; then
            echo "::error::所有源都拿不到 Gradle 8.9"
            exit 1
          fi
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle 8.9 (fallback)
        if: steps.system_gradle.outcome == 'failure'
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorduet-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
