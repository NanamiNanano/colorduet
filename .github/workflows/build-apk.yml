name: build-apk

on:
  push:
    paths:
      - 'android/**'
      - 'colorpick/web/**'
      - 'tools/sync_assets.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync web assets into APK
        run: python3 tools/sync_assets.py

      # 不用 gradle/actions/setup-gradle：它要去 services.gradle.org 拉发行包，
      # 这一步反复 504，整个流水线在编译之前就失败。
      # 改成自己下载（重试 + 备用源 + 缓存）；runner 自带的 Gradle 9.8.2
      # 与 AGP 8.7.3 不兼容，不能直接用。
      - name: Cache Gradle 8.9
        uses: actions/cache@v4
        with:
          path: '~/gradle-8.9'
          key: gradle-8.9-bin-v1

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          GRADLE_BIN="$HOME/gradle-8.9/bin/gradle"
          if [ -x "$GRADLE_BIN" ]; then
            echo "Gradle 8.9 already cached, skip download"
          else
            ok=0
            for url in \
              "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
            do
              echo "trying $url"
              if curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                    --connect-timeout 20 --max-time 600 \
                    -o /tmp/gradle-8.9-bin.zip "$url"; then
                unzip -q -o /tmp/gradle-8.9-bin.zip -d "$HOME"
                ok=1
                break
              fi
              echo "that source failed, trying next"
            done
            if [ "$ok" != "1" ]; then
              echo "::error::could not download Gradle 8.9 from any source"
              exit 1
            fi
          fi
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show Gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorduet-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
